name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, openssl, pdo_sqlite, soap, zip
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Compilar interfaz
        run: |
          npm ci
          npm run build

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas y formato
        run: |
          php artisan test
          vendor/bin/pint --test

      - name: Construir imagen de despliegue
        run: docker build --target web -t facturaya-web:ci .
