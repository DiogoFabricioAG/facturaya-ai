services:
  app:
    build:
      context: .
      target: app
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY_FILE: /run/secrets/app_key
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: facturaya
      DB_USERNAME: facturaya
      DB_PASSWORD_FILE: /run/secrets/db_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      PLATFORM_ADMIN_TOKEN_FILE: /run/secrets/platform_admin_token
    secrets:
      - app_key
      - db_password
      - openai_api_key
      - platform_admin_token
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: facturaya
      POSTGRES_USER: facturaya
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturaya -d facturaya"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_storage:
  postgres_data:

secrets:
  app_key:
    file: ./secrets/app_key
  db_password:
    file: ./secrets/db_password
  openai_api_key:
    file: ./secrets/openai_api_key
  platform_admin_token:
    file: ./secrets/platform_admin_token
